---
# zizmor configuration: https://docs.zizmor.sh/configuration/
rules:
  adhoc-packages:
    # pr-lint.yml has no setup-node, so on a Node 25+ runner image it installs
    # corepack itself; the version is pinned and install scripts are disabled.
    ignore:
      - pr-lint.yml
  use-trusted-publishing:
    # npm trusted publishing requires registry-side setup; tracked separately
    ignore:
      - publish.yml
