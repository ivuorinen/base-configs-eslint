---
# zizmor configuration: https://docs.zizmor.sh/configuration/
rules:
  adhoc-packages:
    # pr-lint.yml has no setup-node, so on a Node 25+ runner image it installs
    # corepack itself; the version is pinned and install scripts are disabled.
    ignore:
      - pr-lint.yml
  self-repository:
    # The `$/` self-repository form zizmor suggests for the `./` reusable
    # workflow call is rejected by actionlint 1.7.12, the latest release,
    # which pre-commit and PR Lint run; support is tracked in
    # rhysd/actionlint#711. Switch to `$/` and drop this ignore once an
    # actionlint release accepts it.
    ignore:
      - publish.yml
