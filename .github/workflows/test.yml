---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  pull_request:
    branches: [main, master]
  workflow_call:

# Suffix keeps this group distinct from a caller's group when run via
# workflow_call (github.workflow resolves to the caller), avoiding a
# self-deadlock with publish.yml's concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable corepack
        shell: sh
        # .nvmrc pins Node 24, which bundles corepack.
        run: corepack enable

      - name: Cache Node Modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock', '.nvmrc') }}

      # Unconditional and immutable: publish.yml runs this workflow as its
      # pre-release gate, and a cache-hit skip used the restored node_modules
      # unchecked, while a plain `yarn install` rewrote a drifted lockfile
      # instead of failing. --mode=skip-build keeps dependency install scripts
      # off the runner; nothing here needs a build step.
      - name: Install Dependencies
        shell: bash
        run: yarn install --immutable --mode=skip-build

      - name: Run Tests
        run: yarn test
