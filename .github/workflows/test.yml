---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test

on:
  pull_request:
    branches: [main, master]
  workflow_call:

# Suffix keeps this group distinct from a caller's group when run via
# workflow_call (github.workflow resolves to the caller), avoiding a
# self-deadlock with publish.yml's concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install and enable corepack
        shell: sh
        run: npm install -g corepack --force && corepack enable

      - name: Cache Node Modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock', '.nvmrc') }}

      - name: Install Dependencies
        shell: bash
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install

      - name: Run Tests
        run: yarn test
